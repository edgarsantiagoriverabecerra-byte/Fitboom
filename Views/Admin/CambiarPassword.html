<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Estilo personalizado para el color neón acorde a tu diseño */
        .text-neon, .bg-neon {
            color: #ADFF2F !important;
        }
        .bg-neon {
            background-color: #ADFF2F !important;
        }
    </style>
</head>
<body class="bg-black text-white">

    <div class="container py-5">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card bg-dark border-secondary shadow-sm">
                    <div class="card-header bg-transparent border-secondary text-white fw-bold">
                        <i class="bi bi-key-fill me-2 text-neon"></i> Actualizar Contraseña
                    </div>
                    <div class="card-body">
                        <!-- Alerta de Error (Dinámica mediante JS/Servidor) -->
                        <div class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;" id="alertaError">
                            <span id="textoMensajeError"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Alerta de Éxito (Dinámica mediante JS/Servidor) -->
                        <div class="alert alert-success alert-dismissible fade show" role="alert" style="display: none;" id="alertaExito">
                            <span id="textoMensajeExito"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form action="/Admin/CambiarPassword" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-white small fw-bold">Contraseña Actual</label>
                                <input type="password" name="passwordActual" class="form-control bg-secondary text-white border-0" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white small fw-bold">Nueva Contraseña</label>
                                <input type="password" name="nuevoPassword" id="nuevoPassword" class="form-control bg-secondary text-white border-0" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white small fw-bold">Confirmar Nueva Contraseña</label>
                                <input type="password" name="confirmarPassword" id="confirmarPassword" class="form-control bg-secondary text-white border-0" required />
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="/Admin/Index" class="btn btn-outline-light btn-sm">Cancelar</a>
                                <button type="submit" class="btn btn-sm bg-neon text-dark fw-bold">
                                    <i class="bi bi-check-lg me-1"></i> Actualizar Contraseña
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
