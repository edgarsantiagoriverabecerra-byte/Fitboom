<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Usuario</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">

    <div class="container mt-4" style="max-width: 600px;">
        <h2 class="mb-2" style="color: #ADFF2F; font-weight: bold;">Detalles del Usuario</h2>
        <h5 class="mb-4 text-muted">Información registrada en la plataforma</h5>

        <div style="background-color: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333;">
            <dl class="row">
                <dt class="col-sm-4 text-muted">ID:</dt>
                <dd class="col-sm-8" style="font-size: 15px;" id="detalleId">1</dd>

                <dt class="col-sm-4 text-muted">Nombre:</dt>
                <dd class="col-sm-8 fw-bold" style="font-size: 16px;" id="detalleNombre">Carlos Méndez</dd>

                <dt class="col-sm-4 text-muted">Correo electrónico:</dt>
                <dd class="col-sm-8" id="detalleCorreo">carlos.mendez@fitboom.com</dd>

                <dt class="col-sm-4 text-muted">Rol:</dt>
                <dd class="col-sm-8">
                    <!-- El color del badge se puede ajustar según el rol dinámicamente -->
                    <span class="badge" id="detalleRolBadge" style="background-color: #ADFF2F; color: #000; font-weight: bold; padding: 6px 12px;">
                        Administrador
                    </span>
                </dd>
            </dl>

            <div class="mt-4 d-flex justify-content-between align-items-center">
                <a href="/Usuarios/Index" class="btn btn-outline-secondary px-4">Volver a la Lista</a>
                <a href="/Usuarios/Edit/1" class="btn fw-bold px-4" style="background-color: #ADFF2F; color: #000; border: none;">Editar Usuario</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script opcional para asignar colores según el rol en HTML puro -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const badge = document.getElementById('detalleRolBadge');
            const rol = badge.textContent.trim();
            
            if (rol === "Entrenador") {
                badge.style.backgroundColor = "#fd7e14";
                badge.style.color = "#fff";
            } else if (rol === "Nutricionista") {
                badge.style.backgroundColor = "#6f42c1";
                badge.style.color = "#fff";
            } else if (rol === "Cliente") {
                badge.style.backgroundColor = "#0d6efd";
                badge.style.color = "#fff";
            }
        });
    </script>
</body>
</html>
