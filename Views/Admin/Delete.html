<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Usuario</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">

    <div class="container mt-4" style="max-width: 600px;">
        <h2 class="mb-2" style="color: #ff4d4d; font-weight: bold;">Eliminar Usuario</h2>
        <h5 class="mb-4 text-muted">¿Estás seguro de que deseas eliminar este usuario de forma permanente?</h5>

        <div style="background-color: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333;">
            <dl class="row">
                <dt class="col-sm-4 text-muted">Nombre:</dt>
                <dd class="col-sm-8 fw-bold" style="font-size: 16px;">Carlos Méndez</dd>

                <dt class="col-sm-4 text-muted">Correo:</dt>
                <dd class="col-sm-8">carlos.mendez@fitboom.com</dd>

                <dt class="col-sm-4 text-muted">Rol:</dt>
                <dd class="col-sm-8">
                    <span class="badge" style="background-color: #ADFF2F; color: #000; font-weight: bold; padding: 5px 10px;">
                        Administrador
                    </span>
                </dd>
            </dl>

            <form action="/Usuarios/Delete" method="POST" class="mt-4 d-flex justify-content-between align-items-center">
                <!-- Campo oculto para el ID del usuario -->
                <input type="hidden" name="IdUsuario" value="1" />

                <a href="/Usuarios/Index" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-danger fw-bold px-4" style="background-color: #dc3545; border: none;">Sí, Eliminar</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
