<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - FITBOOM Admin</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .text-neon, .border-neon {
            color: #ccff00 !important;
            border-color: #ccff00 !important;
        }
        .bg-neon, .btn-neon {
            background-color: #ccff00 !important;
            color: #000 !important;
        }
        .btn-neon:hover {
            background-color: #b3e600 !important;
            color: #000 !important;
        }
    </style>
</head>
<body class="bg-black text-white">

    <div class="container py-4">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-white mb-1">
                    <i class="bi bi-person-circle text-neon me-2"></i>Mi Perfil
                </h3>
                <p class="text-light opacity-75 small mb-0">
                    Administra la información de tu cuenta en FITBOOM.
                </p>
            </div>
        </div>

        <!-- Alerta de Éxito (Opcional / Dinámica mediante JS) -->
        <div class="alert alert-success alert-dismissible fade show bg-dark text-success border-success mb-4" role="alert" style="display: none;" id="alertaExito">
            <i class="bi bi-check-circle-fill me-2"></i> <span id="textoMensajeExito"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row">
            <!-- Tarjeta Izquierda (Perfil / Avatar) -->
            <div class="col-md-4 mb-4">
                <div class="card bg-dark border-secondary shadow-sm text-center p-4">
                    <div class="position-relative d-inline-block mx-auto mt-3">
                        <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="rounded-circle border border-2 border-neon" style="width: 120px; height: 120px; object-fit: cover;" id="avatarPreview" />
                    </div>
                    <div class="card-body">
                        <h4 class="fw-bold text-white mb-1" id="nombreCompletoPreview">Santiago Rivera</h4>
                        <p class="text-muted small mb-3" id="correoPreview">SantiagoR@gmail.com</p>

                        <span class="badge bg-neon text-dark fw-bold px-3 py-2 mb-3" id="rolPreview">
                            Administrador
                        </span>
                    </div>
                </div>
            </div>

            <!-- Formulario Derecho -->
            <div class="col-md-8">
                <div class="card bg-dark border-secondary shadow-sm">
                    <div class="card-header border-bottom border-secondary bg-transparent py-3">
                        <h5 class="fw-bold text-white mb-0">
                            <i class="bi bi-pencil-square text-neon me-2"></i>Actualizar Datos y Foto de Perfil
                        </h5>
                    </div>
                    <div class="card-body">
                        <form action="/Usuario/Perfil" method="POST">
                            <input type="hidden" name="IdUsuario" value="1" />

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Nombre(s)</label>
                                <input type="text" name="Nombre" class="form-control bg-dark text-white border-secondary" value="Santiago" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Apellido(s)</label>
                                <input type="text" name="Apellido" class="form-control bg-dark text-white border-secondary" value="Rivera" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Correo Electrónico</label>
                                <input type="email" name="Correo" class="form-control bg-dark text-white border-secondary" value="SantiagoR@gmail.com" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Rol del Sistema</label>
                                <input type="text" name="Rol" class="form-control bg-dark text-white border-secondary" value="Administrador" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">URL de la Foto de Perfil</label>
                                <input type="text" name="FotoUrl" id="inputFotoUrl" value="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150&auto=format&fit=crop&q=80" class="form-control bg-dark text-white border-secondary" placeholder="Pega el enlace de tu imagen" />
                                <small class="text-muted" style="font-size: 0.75rem;">Actualiza el enlace y haz clic en Guardar para cambiar la foto en todo el panel.</small>
                            </div>

                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-neon fw-bold px-4">
                                    <i class="bi bi-save me-1"></i> Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script opcional para previsualizar la foto de perfil en tiempo real al escribir la URL -->
    <script>
        const inputUrl = document.getElementById('inputFotoUrl');
        const avatarPreview = document.getElementById('avatarPreview');

        inputUrl.addEventListener('input', function() {
            if (this.value.trim() !== '') {
                avatarPreview.src = this.value;
            }
        });
    </script>
</body>
</html>
