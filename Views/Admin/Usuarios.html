<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - FITBOOM</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .text-neon {
            color: #ADFF2F !important;
        }
    </style>
</head>
<body class="bg-black text-white">

    <div class="container py-4">
        <!-- Encabezado de la Sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-white mb-1">
                    <i class="bi bi-people-fill text-neon me-2"></i>Gestión de Usuarios
                </h3>
                <p class="text-light opacity-75 small mb-0">
                    Listado de usuarios registrados en FITBOOM.
                </p>
            </div>
        </div>

        <!-- Tarjeta con la Tabla de Usuarios -->
        <div class="card bg-dark border-secondary shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-white-50 border-bottom border-secondary small">
                                <th class="ps-3" style="width: 80px;">ID</th>
                                <th>Nombre Completo</th>
                                <th>Correo</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Usuario Ejemplo 1: Administrador -->
                            <tr>
                                <td class="ps-3 text-white-50 small">#1</td>
                                <td class="fw-semibold text-white">Carlos Méndez</td>
                                <td class="text-light opacity-75">carlos.mendez@fitboom.com</td>
                                <td>
                                    <span class="badge bg-danger fw-bold px-3 py-2">
                                        Administrador
                                    </span>
                                </td>
                            </tr>
                            <!-- Usuario Ejemplo 2: Entrenador -->
                            <tr>
                                <td class="ps-3 text-white-50 small">#2</td>
                                <td class="fw-semibold text-white">Mateo Silva</td>
                                <td class="text-light opacity-75">mateo.silva@fitboom.com</td>
                                <td>
                                    <span class="badge bg-warning text-dark fw-bold px-3 py-2">
                                        Entrenador
                                    </span>
                                </td>
                            </tr>
                            <!-- Usuario Ejemplo 3: Cliente -->
                            <tr>
                                <td class="ps-3 text-white-50 small">#3</td>
                                <td class="fw-semibold text-white">Santiago Rivera</td>
                                <td class="text-light opacity-75">santiago.rivera@fitboom.com</td>
                                <td>
                                    <span class="badge bg-primary fw-bold px-3 py-2">
                                        Cliente
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
