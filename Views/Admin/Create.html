<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Usuario</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">

    <div class="container mt-4" style="max-width: 600px;">
        <h2 class="mb-4" style="color: #ADFF2F; font-weight: bold;">Agregar Nuevo Usuario</h2>

        <div style="background-color: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333;">
            <form action="/Usuarios/Create" method="POST">
                <!-- Resumen de errores general (Opcional mediante JS) -->
                <div class="text-danger mb-3" id="errorSummary" style="display: none;"></div>

                <div class="mb-3">
                    <label class="form-label text-muted">Nombre</label>
                    <input type="text" name="Nombre" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese el nombre" required />
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Apellido</label>
                    <input type="text" name="Apellido" class="form-control bg-dark text-white border-secondary" placeholder="Ingrese el apellido" required />
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Correo Electrónico</label>
                    <input type="email" name="Correo" class="form-control bg-dark text-white border-secondary" placeholder="correo@gmail.com" required />
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Contraseña</label>
                    <input type="password" name="Contrasena" class="form-control bg-dark text-white border-secondary" placeholder="********" required />
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Rol</label>
                    <select name="Rol" class="form-control bg-dark text-white border-secondary" required>
                        <option value="">Seleccione un rol...</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Entrenador">Entrenador</option>
                        <option value="Nutricionista">Nutricionista</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/Usuarios/Index" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn fw-bold px-4" style="background-color: #ADFF2F; color: #000; border: none;">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
