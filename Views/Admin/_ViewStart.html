<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar / Menú de _AdminLayout -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-black sidebar collapse border-end border-secondary p-3" style="min-height: 100vh;">
                <h4 class="text-white mb-4" style="color: #ADFF2F !important;">Admin Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">Perfil</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-white">Configuración</a>
                    </li>
                </ul>
            </nav>

            <!-- Contenido Principal (Donde se renderizaría la vista) -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="container py-4">
                    <h2 class="mb-4" style="color: #ADFF2F; font-weight: bold;">Contenido de la Vista</h2>
                    <p class="text-muted">Aquí iría el contenido específico de tu página (como el formulario de perfil o configuración que convertimos antes).</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
