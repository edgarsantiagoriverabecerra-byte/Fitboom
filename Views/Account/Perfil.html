<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black">

    <div class="container py-4" style="color: #ffffff; max-width: 900px;">
        <h2 class="mb-4" style="color: #ADFF2F; font-weight: bold;">Mi Perfil</h2>

        <!-- Alerta de Éxito (Opcional / Dinámica mediante JS) -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: #1e3a1e; border-color: #2e5a2e; color: #ADFF2F; display: none;" id="alertaExito">
            <span id="textoMensajeExito"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Alerta de Error (Opcional / Dinámica mediante JS) -->
        <div class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;" id="alertaError">
            <span id="textoMensajeError"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form action="/Account/Perfil" method="POST" enctype="multipart/form-data">
            <div class="row g-4">
                <!-- Columna Izquierda: Foto de Perfil -->
                <div class="col-md-4">
                    <div class="card p-3 text-center" style="background-color: #1f242d; border: 1px solid #2e3542; border-radius: 8px;">
                        <div class="mb-3 d-flex justify-content-center">
                            <img id="previewFoto" src="/images/imagen predeterminada.jpg"
                                 alt="Foto de Perfil"
                                 class="rounded-circle border"
                                 style="width: 160px; height: 160px; object-fit: cover; border-color: #ADFF2F !important;" />
                        </div>
                        <label class="form-label text-muted mb-2">Cambiar Foto de Perfil</label>
                        <input type="file" class="form-control form-control-sm bg-secondary text-white border-0" name="FotoArchivo" accept="image/*" onchange="mostrarVistaPrevia(this)" />
                    </div>
                </div>

                <!-- Columna Derecha: Información de Perfil -->
                <div class="col-md-8">
                    <div class="card p-4" style="background-color: #1f242d; border: 1px solid #2e3542; border-radius: 8px;">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 py-2" name="Nombre" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Correo Electrónico</label>
                            <input type="email" class="form-control bg-secondary text-white border-0 py-2" name="Correo" readonly style="opacity: 0.7; cursor: not-allowed;" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Rol Asignado</label>
                            <input type="text" class="form-control bg-secondary text-white border-0 py-2" name="Rol" readonly style="opacity: 0.7; cursor: not-allowed;" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Restricciones Alimenticias</label>
                            <textarea class="form-control bg-secondary text-white border-0" name="RestriccionesAlimenticias" rows="3" placeholder="Ej. Intolerante a la lactosa, vegetariano, alergia a frutos secos..."></textarea>
                        </div>

                        <div class="mt-2">
                            <button type="submit" class="btn font-weight-bold px-4 py-2" style="background-color: #ADFF2F; color: #000; font-weight: bold;">
                                Guardar Cambios
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script para la vista previa de la imagen -->
    <script>
        function mostrarVistaPrevia(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('previewFoto').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
