<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black">

    <div class="container mt-5 text-white" style="max-width: 600px;">
        <h2 class="mb-4" style="color: #ADFF2F;">Configuración de la Cuenta</h2>

        <!-- Alerta de Éxito (Opcional / Dinámica) -->
        <div class="alert alert-success bg-dark text-success border-success mb-3" style="display: none;" id="alertaExito">
            <!-- Mensaje de éxito aquí -->
        </div>

        <!-- Alerta de Error (Opcional / Dinámica) -->
        <div class="alert alert-danger bg-dark text-danger border-danger mb-3" style="display: none;" id="alertaError">
            <!-- Mensaje de error aquí -->
        </div>

        <div class="p-4 bg-dark rounded border border-secondary mb-4">
            <h4 class="h5 mb-3 text-white">Cambiar Contraseña</h4>
            <form action="tu-ruta-de-destino" method="POST">
                <div class="mb-3">
                    <label class="form-label">Contraseña Actual</label>
                    <input type="password" name="contrasenaActual" class="form-control bg-secondary text-white border-0" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Nueva Contraseña</label>
                    <input type="password" name="nuevaContrasena" class="form-control bg-secondary text-white border-0" required />
                </div>

                <button type="submit" class="btn" style="background-color: #ADFF2F; color: black; font-weight: bold;">
                    Actualizar Contraseña
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
